    <title>Miklens Trial Manager</title>
    <style>
      /* Critical CSS for initial load - prevents white flash */
      html, body, #root {
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #f8fafc;
        background: linear-gradient(135deg, hsla(160, 100%, 96%, 1) 0%, hsla(190, 100%, 96%, 1) 50%, hsla(160, 100%, 96%, 1) 100%);
      }
      /* Safe area padding for notched devices */
      :root {
        --sat: env(safe-area-inset-top);
        --sab: env(safe-area-inset-bottom);
        --sal: env(safe-area-inset-left);
        --sar: env(safe-area-inset-right);
        --safe-area: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
      }
      /* PWA-specific styles */
      @media (display-mode: standalone) {
        body {
          overscroll-behavior: none;
        }
      }
      /* Loading spinner */
      .initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #ecfdf5 0%, #d1fae5 100%);
        z-index: 9999;
      }
      .initial-loader .spinner {
        width: 48px;
        height: 48px;
        border: 4px solid #059669;
        border-top-color: transparent;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      .initial-loader p {
        margin-top: 16px;
        color: #059669;
        font-family: 'Outfit', sans-serif;
        font-weight: 500;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Initial loading state to prevent white flash -->
      <div class="initial-loader">
        <div class="spinner"></div>
        <p>Loading Trial Manager...</p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
