    <script>
      // Lock mobile viewport zoom & prevent accidental double-tap or pinch-to-zoom on PWA shell
      (function() {
        if (typeof window !== 'undefined') {
          // Disable Safari gesture zoom on main document
          document.addEventListener('gesturestart', function(e) {
            if (!e.target.closest('.allow-pinch-zoom')) {
              e.preventDefault();
            }
          }, { passive: false });
          document.addEventListener('gesturechange', function(e) {
            if (!e.target.closest('.allow-pinch-zoom')) {
              e.preventDefault();
            }
          }, { passive: false });
          // Disable double-tap-to-zoom jumping
          var lastTouch = 0;
          document.addEventListener('touchend', function(e) {
            var now = Date.now();
            if (now - lastTouch <= 300) {
              if (!e.target.closest('input, textarea, select, .allow-double-tap')) {
                e.preventDefault();
              }
            }
            lastTouch = now;
          }, { passive: false });
        }
      })();
    </script>

    <title>Miklens Agronomic Trial Manager</title>
    <style>
      /* Critical CSS for initial load - prevents white flash & overflow */
      html, body {
        height: 100%;
        width: 100%;
        max-width: 100vw;
        overflow-x: hidden;
        margin: 0;
        padding: 0;
        background-color: #f8faf9;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }
      #root {
        min-height: 100%;
        width: 100%;
        max-width: 100vw;
        overflow-x: hidden;
      }
      /* Safe area padding for notched devices */
      :root {
        --sat: env(safe-area-inset-top);
        --sab: env(safe-area-inset-bottom);
        --sal: env(safe-area-inset-left);
        --sar: env(safe-area-inset-right);
        --safe-area: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
      }
      /* PWA-specific native behavior */
      @media (display-mode: standalone) {
        body {
          overscroll-behavior-y: contain;
          overscroll-behavior-x: none;
          -webkit-user-select: none;
          user-select: none;
        }
        input, textarea, [contenteditable="true"] {
          -webkit-user-select: text;
          user-select: text;
        }
      }
      /* Loading spinner */
      .initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #f8faf9;
        z-index: 9999;
      }
      .initial-loader .spinner {
        width: 44px;
        height: 44px;
        border: 3.5px solid #e2e8f0;
        border-top-color: #154734;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      .initial-loader p {
        margin-top: 14px;
        color: #154734;
        font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 600;
        font-size: 14px;
        letter-spacing: -0.01em;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Initial loading state to prevent white flash -->
      <div class="initial-loader">
        <div class="spinner"></div>
        <p>Loading Trial Manager...</p>
      </div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Self-healing fallback: If initial loader is still present after 7s due to stale cache/chunk error
      setTimeout(function() {
        var loader = document.querySelector('.initial-loader');
        if (loader && !window.__appMounted) {
          console.warn('[Self-Healing] Initial load timeout detected. Clearing stale service worker & cache...');
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              for (var i = 0; i < regs.length; i++) { regs[i].unregister(); }
            });
          }
          if ('caches' in window) {
            caches.keys().then(function(keys) {
              keys.forEach(function(k) { caches.delete(k); });
            });
          }
          if (!sessionStorage.getItem('loader_auto_recovered')) {
            sessionStorage.setItem('loader_auto_recovered', 'true');
            window.location.reload();
          }
        }
      }, 7000);
    </script>
  </body>
