<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#154734" />
      <stop offset="100%" stop-color="#0a2318" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#4ade80" />
    </linearGradient>
    <linearGradient id="sproutGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#a7f3d0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Premium rounded squircle badge -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" filter="url(#shadow)" />
  <rect x="26" y="26" width="460" height="460" rx="106" fill="none" stroke="#22c55e" stroke-width="4" stroke-opacity="0.3" />

  <!-- Scientific Trial Grid Accent Lines -->
  <path d="M128 352h256M128 400h256" stroke="#22c55e" stroke-opacity="0.15" stroke-width="4" stroke-linecap="round" />
  <path d="M180 320v96M256 320v96M332 320v96" stroke="#22c55e" stroke-opacity="0.15" stroke-width="4" stroke-linecap="round" />

  <!-- Scientific Flask Silhouette -->
  <path d="M228 116h56v56l68 136c14 28-6 60-38 60H198c-32 0-52-32-38-60l68-136v-56z"
        fill="none" stroke="#ffffff" stroke-width="18" stroke-linejoin="round" stroke-linecap="round" />
  <path d="M216 116h80" stroke="#ffffff" stroke-width="18" stroke-linecap="round" />

  <!-- Fluid Level inside Flask -->
  <path d="M182 312c22-8 44 4 66 2s46-10 68-4l18 36c5 10-2 22-14 22H190c-12 0-19-12-14-22l6-34z"
        fill="#15803d" fill-opacity="0.45" />

  <!-- Flourishing Agronomic Sprout / Leaf emerging from the flask -->
  <!-- Main Right Leaf -->
  <path d="M256 220c32-52 88-68 120-60 4 36-12 92-64 112-24 9-44 2-56-12v-40z"
        fill="url(#leafGrad)" />
  <!-- Left Sprout Leaf -->
  <path d="M256 250c-24-40-68-52-92-46-3 28 9 70 48 86 18 7 34 2 44-9v-31z"
        fill="url(#sproutGrad)" />
  <!-- Center Stem -->
  <path d="M256 340V190" stroke="#86efac" stroke-width="12" stroke-linecap="round" />
</svg>